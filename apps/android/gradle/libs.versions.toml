# Veskra Android version catalog. Every version is PINNED (no ranges, no "+", no "latest").
# Evidence and rationale for each pin: apps/android/README.md "Pinned versions".
# Constraint: the build runs on Gradle 8.14.3 (wrapper). AGP 9.x requires Gradle 9, and the
# 2026 Compose/Lifecycle/Activity lines require compileSdk 37 + AGP >= 9.2, so the Android
# libraries are pinned to the last lines that compile against API 36 with AGP 8.13.

[versions]
# Build tooling
agp = "8.13.2"
kotlin = "2.3.21"

# Android SDK levels (ADR-002 proposal; MASTER_PLAN §1.3)
minSdk = "29"
targetSdk = "36"
compileSdk = "36"

# AndroidX (Google Maven)
composeBom = "2025.12.00"
material3 = "1.4.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
motionPrediction = "1.0.0"

# Kotlin libraries (Maven Central)
coroutines = "1.10.2"

# Test (Maven Central)
junit = "5.14.4"

[libraries]
# :app (Android only)
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-input-motionprediction = { module = "androidx.input:input-motionprediction", version.ref = "motionPrediction" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Build classpath (only resolved when an Android SDK is present; see root build.gradle.kts)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# :kit tests
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
