[package]
name = "veskra-format"
description = "Versioned .veskra native bundle, integrity, recovery (FMT)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
veskra-core.workspace = true
veskra-raster.workspace = true
veskra-doc.workspace = true
veskra-color.workspace = true
veskra-vector.workspace = true
serde.workspace = true
# float_roundtrip: f32/f64 values in document.json (opacity, geometry) must parse back bit-exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
miniz_oxide.workspace = true
crc32fast.workspace = true
thiserror.workspace = true

[dev-dependencies]
veskra-testkit.workspace = true

[lints]
workspace = true
