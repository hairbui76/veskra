name: Release APKs

# Push a tag `vX.Y.Z[-suffix]` whose version equals `versionName` in apps/android/app/build.gradle.kts:
# this builds the engine for arm64-v8a and x86_64, assembles signed per-ABI APKs and attaches them
# to the GitHub release for that tag (a tag with a `-suffix` becomes a pre-release).
# "Run workflow" by hand builds the same APKs as a workflow artifact without touching any release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.2.13676358"
  MIN_API: "29" # == minSdk

jobs:
  apk:
    name: Signed release APKs (arm64-v8a, x86_64, universal)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from build.gradle.kts
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' apps/android/app/build.gradle.kts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain (rust-toolchain.toml, includes the Android targets)
        run: rustup show

      - name: Android NDK and platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build and strip libveskra_ffi.so
        run: |
          bin="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android$MIN_API-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android$MIN_API-clang"
          cargo build -p veskra-ffi --release --locked --target aarch64-linux-android --target x86_64-linux-android
          libs=apps/android/app/src/main/jniLibs
          for pair in "aarch64-linux-android arm64-v8a" "x86_64-linux-android x86_64"; do
            set -- $pair
            mkdir -p "$libs/$2"
            "$bin/llvm-strip" --strip-unneeded -o "$libs/$2/libveskra_ffi.so" "target/$1/release/libveskra_ffi.so"
            # 16 KB page alignment is required on newer devices.
            "$bin/llvm-readelf" -l "$libs/$2/libveskra_ffi.so" | awk '/LOAD/ && $NF != "0x4000" { bad = 1 } END { exit bad }'
          done

      - name: Signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VESKRA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret VESKRA_RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "VESKRA_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APKs
        working-directory: apps/android
        env:
          VESKRA_RELEASE_STORE_PASSWORD: ${{ secrets.VESKRA_RELEASE_STORE_PASSWORD }}
          VESKRA_RELEASE_KEY_ALIAS: ${{ secrets.VESKRA_RELEASE_KEY_ALIAS }}
          VESKRA_RELEASE_KEY_PASSWORD: ${{ secrets.VESKRA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name, verify and checksum
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          v="${{ steps.version.outputs.version }}"
          mkdir dist
          for abi in arm64-v8a x86_64 universal; do
            cp "apps/android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/veskra-$v-$abi.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/veskra-$v-$abi.apk" | grep "certificate SHA-256"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: veskra-${{ steps.version.outputs.version }}-apks
          path: dist/

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            flags=()
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" dist/* "${flags[@]}" --title "Veskra ${tag#v}" --generate-notes
          fi
