name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust fmt / clippy / test / layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Crate dependency direction (ADR-016)
        run: python3 scripts/check_deps.py
      - name: Ticket tracker consistency
        run: python3 scripts/progress.py check
      - name: Type-check engine + FFI for Android targets (no NDK link)
        run: |
          cargo check -p veskra-ffi --target aarch64-linux-android --locked
          cargo check -p veskra-ffi --target x86_64-linux-android --locked

  interop:
    name: Independent-oracle interop suite (psd-tools, Krita, Inkscape, rsvg, poppler, LittleCMS)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install oracle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends krita inkscape librsvg2-bin poppler-utils qpdf imagemagick xvfb
          pip3 install --break-system-packages -r scripts/requirements-oracles.txt
      - name: Run interop suite
        run: bash scripts/interop/run_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: interop-report
          path: target/interop/

  kotlin-kit:
    name: Kotlin :kit JVM tests (incl. real JNI into host libveskra_ffi.so)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: rustup show
      - run: cargo build -p veskra-ffi --release --locked
      - name: Gradle :kit tests
        working-directory: apps/android
        run: ./gradlew :kit:test --console=plain -Dveskra.ffi.lib=$GITHUB_WORKSPACE/target/release/libveskra_ffi.so

  android-apk:
    # NOT verified from the authoring environment (Android SDK host was unreachable there).
    # Expected to run on GitHub-hosted runners, which ship the Android SDK.
    name: Android debug APK (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: rustup show
      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Rust for Android
        # ANDROID_HOME is a runner environment variable, not a workflow `env` entry: read it in the shell.
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash apps/android/scripts/build-rust.sh
      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: veskra-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  audit:
    name: License / advisory audit (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
