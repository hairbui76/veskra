name: Website

# Publishes site/ (the landing page at https://veskra.hairbui76.id.vn) to GitHub Pages, together
# with the APKs of the newest release (scripts/site_release_bundle.py) so the download buttons
# fetch from the site's own domain. release.yml re-runs this after every published release.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "scripts/site_release_bundle.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Bundle the newest release's APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site_release_bundle.py site/download
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
